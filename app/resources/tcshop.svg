<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f72ff"/>
      <stop offset="1" stop-color="#4a28cf"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3363"/>
      <stop offset="1" stop-color="#1a1d3b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="#ffffff" opacity="0.07"/>

  <!-- cartes en éventail, qui sortent de la caisse -->
  <g transform="rotate(-17 86 120)">
    <rect x="50" y="34" width="72" height="100" rx="10" fill="#ffffff"/>
    <rect x="57" y="41" width="58" height="86" rx="6" fill="#ef4452"/>
    <path d="M86 62 l8 16 -8 16 -8 -16 z" fill="#ffffff"/>
  </g>
  <g transform="rotate(14 170 120)">
    <rect x="134" y="30" width="72" height="100" rx="10" fill="#ffffff"/>
    <rect x="141" y="37" width="58" height="86" rx="6" fill="url(#gold)"/>
    <path d="M170 56 l6.5 13.5 14.5 2 -10.5 10 2.6 14.5 -13.1 -7 -13.1 7 2.6 -14.5 -10.5 -10 14.5 -2 z" fill="#ffffff"/>
  </g>

  <!-- caisse enregistreuse -->
  <rect x="100" y="98" width="56" height="30" rx="7" fill="#1a1d3b"/>
  <rect x="107" y="104" width="42" height="17" rx="4" fill="#5eead4"/>
  <path d="M62 128 H194 L210 184 H46 Z" fill="url(#body)"/>
  <g fill="#ffffff" opacity="0.9">
    <rect x="80" y="140" width="22" height="12" rx="3"/>
    <rect x="117" y="140" width="22" height="12" rx="3"/>
    <rect x="154" y="140" width="22" height="12" rx="3"/>
    <rect x="75" y="160" width="24" height="12" rx="3"/>
    <rect x="116" y="160" width="24" height="12" rx="3"/>
  </g>
  <rect x="157" y="160" width="24" height="12" rx="3" fill="#22c55e"/>
  <rect x="36" y="184" width="184" height="40" rx="10" fill="#1a1d3b"/>
  <rect x="100" y="199" width="56" height="9" rx="4.5" fill="#8f72ff"/>

  <!-- dé -->
  <g transform="rotate(16 196 186)">
    <rect x="166" y="156" width="60" height="60" rx="13" fill="#ffffff" stroke="#1a1d3b" stroke-width="5"/>
    <g fill="#1a1d3b">
      <circle cx="181" cy="171" r="6"/>
      <circle cx="211" cy="171" r="6"/>
      <circle cx="196" cy="186" r="6"/>
      <circle cx="181" cy="201" r="6"/>
      <circle cx="211" cy="201" r="6"/>
    </g>
  </g>
